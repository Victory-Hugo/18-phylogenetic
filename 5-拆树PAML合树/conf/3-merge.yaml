projectpath: "/mnt/l/22-WHALE/8-优化PAML大于ML进行校正方案"

paths:
  split_output_dir: "output/split"
  paml_output_dir: "output/paml"
runtime:
  log_level: "INFO"
tools:
  python: "python3"
merge:
  output_dir: "output/merge"
  analysis_tree_source: "external"
  external_result_dir: null
  clean_output_dir: true
  mode: "backbone_graft"
  global_scale_source: "backbone_plus_overlap"
  subtree_scale_method: "median_log_path_ratio"
  backbone_edge_aggregation: "weighted_geometric_mean"
  randomization_model: "lognormal_multiplicative"
  randomization_sigma: 0.25
  randomization_seed: 42
  min_branch_length: 1e-8
