paths:
  input_tree: "/mnt/l/6_起源地混合地/8-第一轮修稿/1-新的mtDNA系统发育树/output/VFT_rooted.tree"
  outgroup_tip_file: "/mnt/f/onedrive/文档（科研）/脚本/Download/18-phylogenetic/5-拆树PAML合树/conf/outgroup_tips.txt"
  output_dir: "/mnt/f/onedrive/文档（科研）/脚本/Download/18-phylogenetic/5-拆树PAML合树/output/split"
  #? 若不提供 backbone_tree，则运行时自动构建
  backbone_tree: null
  #? 可以不提供，将由算法自动生成
  backbone_tip_id_file: /mnt/f/onedrive/文档（科研）/脚本/Download/18-phylogenetic/5-拆树PAML合树/conf/backbone_tip.txt
runtime:
  #? [注意该数字包括了 backbone_tree 中的 tip 数量]每个子树的最大 tip 数量，超过该数量的子树将继续被拆分
  max_tips: 2000          
  #? backbone_tree 的目标 tip 数量，若 backbone_tree 中的 tip 数量超过该值，则会被进一步拆分
  backbone_size: 1005  
  threads: 20
  clean_output_dir: true
  log_level: "INFO"
  backbone_sampling_strategy: "greedy_farthest_patristic"
  target_partition_mode: "recursive_monophyletic"
tools:
  python: "python3"
  conda_env: "BigLin"
  gotree: "gotree"