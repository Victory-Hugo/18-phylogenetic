projectpath: "."

paths:
  split_output_dir: "output/split"
  paml_output_dir: "output/paml"
runtime:
  log_level: "INFO"
tools:
  python: "python3"
ultrastandard:
  output_dir: "output/ultrastandard"
  clean_output_dir: true
  min_branch_length: 1e-8
  ultrametric_tolerance: 1e-8
  relative_ultrametric_method: "extend_terminal_to_max_depth"
  require_backbone_descendant_anchor: true
  allow_multifurcation: true
  backbone_ultrametric_tree: null
