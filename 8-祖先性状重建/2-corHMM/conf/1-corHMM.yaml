#*##########################
#* 配置文件说明
#* 本分析用于祖先性状重建，使用R包corHMM进行分析
#* 需要准备：
#* 1. 系统发育树文件（.tree）【示例为最大似然树，也可以使用时间树】 
#* 2. 性状数据文件（.tsv）【包含ID和性状数据】
#*##########################

project:
  base_dir: "/mnt/f/OneDrive/文档（科研）/脚本/Download/18-phylogenetic/8-祖先性状重建/2-corHMM"

paths:
  input_tree: "input/1-example.tree"    #? 输入文件
  input_traits: "input/2-traits.tsv"    #? 输入文件
  output_model: "output/result/1-model-compare"
  output_simmap: "output/result/2-simmap"
  output_trans: "output/result/3-trans"
  temp: "temp/1-corHMM"
  log: "log/1-corHMM.log"

columns:
  id: "species"   #? 性状数据文件中物种ID列名
  trait: "state"  #? 性状数据文件中性状列名

tools:
  rscript_bin: "/usr/bin/Rscript"

models:
  candidates: "ER,SYM,ARD"
  selection_criterion: "AIC"
  root_prior: "maddfitz"
  rate_categories: 1
  node_states: "marginal"
  n_starts: 12
  n_cores: 1

simmap:
  n_simulations: 200
  n_cores: 1
  max_attempt: 1000

tree:
  resolve_polytomies: true
  branch_floor_ratio: 0.1
  scale_branch_lengths: true

runtime:
  seed: 20260803
  overwrite: true
