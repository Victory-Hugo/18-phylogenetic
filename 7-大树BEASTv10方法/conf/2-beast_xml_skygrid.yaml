# 2-beast_xml — 根据 LSD2 输出生成 BEAST v10 Thorney XML

project:
  base_dir: "."

paths:
  ml_tree: "input/mtDNA.reroot.IQTREE.tree"
  starting_tree: "output/1-lsd2/1-table/startingTree.lsd2.nwk"
  calibration_membership: "output/0-calibration_membership/1-table/calibration_membership.tsv"
  input_validation: "output/1-lsd2/1-table/input_validation.tsv"
  template_xml: "conf/beast_v10_thorney_skygrid.template.xml"
  output_table: "output/2-beast_skygrid_xml/1-table"
  output_report: "output/2-beast_skygrid_xml/3-report"
  temp: "temp/2-beast_skygrid_xml"
  log: "log/2-beast_skygrid_xml"

tools:
  python_bin: "/home/luolintao/miniconda3/envs/BigLin/bin/python"
  beast_bin: "/home/luolintao/opt/BEASTv10.5.0/bin/beast"

runtime:
  overwrite: true

beast:
  output_prefix: "mtDNA.beast.v10.thorney_skygrid"
  # scale = 有效对齐位点数：data tree 分支长度是 subs/site，
  # 乘以位点数才能换算成分支期望突变数。
  scale: 17990
  chain_length: 100000000
  log_every: 10000
  tree_log_every: 100000
  # clock_rate 必须与节点年龄先验自洽
  clock_rate: 2.53e-8
  skygrid_points: 20
  # skygrid logPopSize 初值（自然对数）。
  skygrid_init_logpop: 5.0

# 校准节点列表（顺序无关，支持任意数量与嵌套）。每个节点的 age/stdev 写成
# BEAST XML 中该节点 TMRCA 的 normalPrior（root 用全树高度，其余用 MRCA）。
calibration:
  nodes:
    - name: root
      is_root: true
      age: 180000
      stdev: 20000
    - name: M
      age: 49000
      stdev: 5000
    - name: N
      age: 59000
      stdev: 5000
