# Ne 轨迹聚类与可视化 —— 唯一配置文件

io:
  input_dir: "input"
  output_dir: "output"
  # auto = 按目录内容自动识别；也可显式指定；特别建议放入 xml+skygrid 的log文件
  input_format: "auto"
  # 可选清单（category / display_name / group / n_tips）。留空 = 在 input_dir 里按表头
  # 自动认领（不含 time 列的那张就是清单），文件名随意
  samples_table: ""

time:
  time_unit: "years"
  years_per_unit: 1
  # 时间段：period_width（每隔多少年计算）切到 period_max（最古老的时间点）为止。
  period_width: 500
  period_max: 50000
  time_periods: []
  # 全时间轴合并分数热图的时间 bin 宽度
  bin_width: 500
  # 分析上界；超出 Skygrid cutOff 会直接报错（那之后只是延续最后一段的常数）。
  # 输入本身覆盖不到这么远时会自动截断并告警，不会拿插值出来的平直段充数
  analysis_max: 50000
  grid_step: 200
  # loess 平滑与求导的带宽。事件时间对它敏感，改动后须复核结论
  smooth_bandwidth: 3000
  # 找不到 XML 时的兜底 cutOff（0 = 不兜底，直接报错）
  cutoff_override: 0

posterior:
  burnin_frac: 0.1
  max_draws: 4000
  # 后验重抽次数：每次每个类别各抽 1 条曲线重聚一次类，得到同簇频率
  n_resample: 500
  cred_level: 0.95
  seed: 20260828

select:
  # 可选：类别的上层分组，用于弦图外圈与热图行注释。留空 = 全部归一组
  group_var: ""
  # 可选：只分析这些类别，逗号分隔。留空 = 全部
  selected_categories: ""
  # 时间窗内落在可靠窗中的比例低于该值的类别，不进入该窗口的聚类
  min_coverage: 0.8
  # 可靠窗判据：log Ne 的 95% HPD 宽度上限（2.0 对应上下界相差约 7.4 倍）
  hpd_width_max: 2.0
  # 把平均 log Ne 中由 log 样本量解释的部分回归掉。需要 n_tips，默认关闭：
  # 回归无法证明那部分一定是估计偏差而非真实差异，开启时须与未校正结果并列报告
  size_adjustment: false   # 示例数据带 n_tips，改成 true 即可开启

cluster:
  distance_metric: "euclidean"
  # ward 只对欧氏距离成立，与其他度量组合会直接报错
  linkage_method: "average"
  # 0 = 按轮廓系数自选
  n_clusters: 0
  k_max: 8
  # zscore / minmax / none：8 个特征量纲不同，不标准化时年代类特征会独占距离
  feature_scaling: "zscore"

figure:
  # pca（默认，无额外依赖）或 umap（需要 umap-learn）
  scatter_method: "pca"
  # coclustering = 后验重抽同簇频率；similarity = 1 − 归一化距离
  chord_metric: "coclustering"
  chord_threshold: 0.5
  # 散点图是否叠加各簇的置信椭圆（簇内不足 3 个点时该簇自动跳过）
  scatter_ellipse: true
  # 色条：直接给一串十六进制颜色（逗号分隔，按"数值小 → 数值大"排列，自动插值到 100 级），
  # 也可以写 diverging / sequential 用内置色板
  heatmap_palette: "#20364F,#31646C,#4E9280,#96B89B,#DCDFD2,#ECD9CF,#D49C87,#B86265,#8B345E,#50184E"
  score_palette: "#20364F,#31646C,#4E9280,#96B89B,#DCDFD2,#ECD9CF,#D49C87,#B86265,#8B345E,#50184E"
  # 多时间段的子图每行排几个
  panels_per_row: 2

runtime:
  debug_mode: false
  log_level: "INFO"
