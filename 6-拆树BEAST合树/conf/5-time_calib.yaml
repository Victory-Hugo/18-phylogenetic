projectpath: "/mnt/f/onedrive/文档（科研）/脚本/Download/18-phylogenetic/6-拆树BEAST合树"

paths:
  ultrastandard_output_dir: "output/ultrastandard"
runtime:
  log_level: "INFO"
tools:
  python: "python3"
time_calib:
  method: "node_calibration" #? 可选项：molecular_clock（分子钟速率整体缩放）、node_calibration（节点标记整体缩放）
  input_tree: null
  output_dir: "output/time_calib"
  clean_output_dir: true
  substitution_rate_per_site_per_year: 2.67e-8
  sequence_length: 16569
  branch_length_unit: "substitutions_per_site"
  node_calibration_tip_name: "RSRS"
  node_calibration_divergence_years: 180000
  output_tree_name: "merged_ultrametric_tree_years.nwk"
  # stage2 BEAST 输出目录，用于定位节点高度 95% HPD 表（substitutions/site）。
  # backbone_analysis/backbone_node_hpd.tsv 与 beast_node_hpd.tsv 会被合并构建 HPD
  # 注册表，并把 HPD 线性传播到最终年代树。fake 模式下这些文件不存在时自动退化为无 HPD 的 NEXUS。
  beast_output_dir: "output/beast"
  nexus_output_name: "merged_time_tree.nexus"   #? BEAST 风格带 height/HPD 注释的最终年代树
  node_table_name: "node_time_table.tsv"        #? 全节点时间信息表（年龄/深度/HPD/来源）
